# Builds the "Ambire Signer" Ledger app for every supported device and syncs the
# resulting plaintext BOLOS load scripts (app.apdu) into the extension, so the
# sideloader in src/web/modules/hardware-wallet/controllers/LedgerController
# always ships the load scripts of the latest app build.
#
# The app sources live in AmbireTech/ledger-ambire-signer. That repo's own
# build_ambire.yml cannot be reused from here (it declares only `workflow_dispatch`
# and `push`, no `workflow_call`), so this workflow calls the LedgerHQ reusable
# workflow that build_ambire.yml itself delegates to, pointing it at the signer
# repo through `app_repository`. Every repo in that chain is public, so the default
# GITHUB_TOKEN is enough - no personal access token, GitHub App or deploy key is
# involved (and an organization cannot own a PAT in the first place).
#
# The device list is read from the signer repo's ledger_app.toml (apex_p, nanox,
# nanos+, stax, flex). The build uploads one artifact per device and then merges
# them into a single "ambire_signer_builds" artifact holding one directory per
# Ledger SDK build target, each containing "bin/app.apdu".

name: Build Ledger "Ambire Signer" 📒

on:
  workflow_dispatch: # Manual trigger
    inputs:
      signer_ref:
        description: 'Branch, tag or commit of ledger-ambire-signer to build'
        required: false
        # ledger-ambire-signer has no tags, so a branch is the only usable ref.
        # This matches that repo's default branch.
        default: feat/apa/add_contracts_in_7702_whitelist
        type: string
  push:
    branches: [feature/ledger-7702]
    # A merge of the pull request this workflow opens only touches the generated
    # artifacts, so ignoring them keeps a merge from kicking off a no-op rebuild.
    paths-ignore:
      - 'src/web/modules/hardware-wallet/controllers/LedgerController/artifacts/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Only consumed by steps in the sync job below. The `env` context is not
  # available in `jobs.<job_id>.with`, so the build job repeats these literals.
  SIGNER_REPOSITORY: AmbireTech/ledger-ambire-signer
  SIGNER_ARTIFACT: ambire_signer_builds
  DOWNLOAD_DIR: ledger-artifacts

jobs:
  build:
    name: Build the Ledger app for all supported devices
    # No `use_case` or `flags` are passed, which mirrors what the signer repo's own
    # build_ambire.yml does. Note ledger_app.toml also defines a `whitelist_keys`
    # use case (EIP7702_TEST_WHITELIST=1) - pass `use_case: whitelist_keys` here if
    # the bundled load scripts are meant to have the Ambire delegator whitelisted.
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_build.yml@v1
    permissions:
      contents: read
      actions: write # The called workflow needs this to upload the artifacts
    with:
      app_repository: AmbireTech/ledger-ambire-signer
      app_branch_name: ${{ inputs.signer_ref || 'feat/apa/add_contracts_in_7702_whitelist' }}
      upload_app_binaries_artifact: ambire_signer_builds

  sync-apdu-artifacts:
    name: Sync the built .apdu load scripts and open a pull request
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code 🛎️
        uses: actions/checkout@v6
        with:
          ref: feature/ledger-7702

      - name: Get Node version
        id: node-version
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_OUTPUT
        shell: bash

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.NODE_VERSION }}

      - name: Download the built Ledger app artifact ⬇️
        # Uploaded by the build job in this same run, so no cross-repo token is
        # needed. Fails the job when the artifact is missing, which is what we
        # want - a silent "nothing to do" would look like a successful sync.
        uses: actions/download-artifact@v6
        with:
          name: ${{ env.SIGNER_ARTIFACT }}
          path: ${{ env.DOWNLOAD_DIR }}

      - name: Write the artifact generator
        run: |
          cat > generate-apdu-artifacts.mjs <<'GENERATOR_EOF'
          import { readdirSync, readFileSync, writeFileSync } from 'node:fs'
          import { join, relative, sep } from 'node:path'

          const DOWNLOAD_DIR = process.env.DOWNLOAD_DIR
          const ARTIFACT_NAME = process.env.SIGNER_ARTIFACT
          const ARTIFACTS_DIR =
            'src/web/modules/hardware-wallet/controllers/LedgerController/artifacts'

          // Keyed by the Ledger SDK build target directory inside the artifact. These
          // differ from the device names in ledger_app.toml: the "nanos+" device is
          // built into a "nanos2" directory.
          const TARGETS = {
            nanox: {
              fileName: 'ambireSignerNanoX.ts',
              constName: 'AMBIRE_SIGNER_NANO_X_APDU',
              label: 'Nano X'
            },
            nanos2: {
              fileName: 'ambireSignerNanoSPlus.ts',
              constName: 'AMBIRE_SIGNER_NANO_S_PLUS_APDU',
              label: 'Nano S Plus'
            },
            stax: {
              fileName: 'ambireSignerStax.ts',
              constName: 'AMBIRE_SIGNER_STAX_APDU',
              label: 'Stax'
            },
            flex: {
              fileName: 'ambireSignerFlex.ts',
              constName: 'AMBIRE_SIGNER_FLEX_APDU',
              label: 'Flex'
            },
            apex_p: {
              fileName: 'ambireSignerApex.ts',
              constName: 'AMBIRE_SIGNER_APEX_APDU',
              label: 'Apex'
            }
          }

          const HEX_DIGITS = new Set('0123456789abcdef')

          const isHexApdu = (line) =>
            line.length > 0 &&
            line.length % 2 === 0 &&
            Array.from(line.toLowerCase()).every((char) => HEX_DIGITS.has(char))

          const findApduFiles = (dir) =>
            readdirSync(dir, { withFileTypes: true }).flatMap((entry) => {
              const entryPath = join(dir, entry.name)

              if (entry.isDirectory()) return findApduFiles(entryPath)

              return entry.name === 'app.apdu' ? [entryPath] : []
            })

          const apduFilePaths = findApduFiles(DOWNLOAD_DIR)

          if (!apduFilePaths.length) {
            console.error(`No app.apdu found anywhere under ${DOWNLOAD_DIR}.`)
            process.exit(1)
          }

          const unrecognizedTargets = []
          const syncedLabels = []

          apduFilePaths.forEach((apduFilePath) => {
            const sourcePath = relative(DOWNLOAD_DIR, apduFilePath)
            const segments = sourcePath.split(sep)
            // Path shape is "<sdk target>/bin/app.apdu", so the target is always the
            // directory holding "bin".
            const sdkTarget = segments[segments.length - 3]
            const target = TARGETS[sdkTarget]

            if (!target) {
              unrecognizedTargets.push(`${sdkTarget} (${sourcePath})`)
              return
            }

            const apduLines = readFileSync(apduFilePath, 'utf8')
              .split('\n')
              .map((line) => line.trim())
              .filter(Boolean)

            const malformedLines = apduLines.filter((line) => !isHexApdu(line))

            if (malformedLines.length) {
              console.error(
                `${sourcePath} is not a plaintext load script, ${malformedLines.length} line(s) are not hex-encoded.`
              )
              process.exit(1)
            }

            const fileContent = [
              '// GENERATED — do not edit by hand.',
              `// Source: ${ARTIFACT_NAME}.zip -> ${sourcePath} (Ambire Signer, ${target.label}).`,
              '// Plaintext BOLOS load script: one hex-encoded APDU per line. See ../ledgerAppLoader.ts.',
              '// ponytail: bundled as a source string. Move to a fetched per-model asset if bundle size matters.',
              '/* eslint-disable */',
              `export const ${target.constName} = \``,
              ...apduLines,
              '`',
              ''
            ].join('\n')

            writeFileSync(join(ARTIFACTS_DIR, target.fileName), fileContent)
            syncedLabels.push(target.label)
            console.log(`Synced ${target.label} -> ${target.fileName} (${apduLines.length} APDUs).`)
          })

          if (unrecognizedTargets.length) {
            console.error(
              `Unrecognized Ledger SDK target(s): ${unrecognizedTargets.join(', ')}. Add them to TARGETS and to artifacts/index.ts.`
            )
            process.exit(1)
          }

          const missingLabels = Object.values(TARGETS)
            .map((target) => target.label)
            .filter((label) => !syncedLabels.includes(label))

          if (missingLabels.length)
            console.warn(`::warning::No build was produced for: ${missingLabels.join(', ')}.`)

          writeFileSync(
            process.env.GITHUB_OUTPUT,
            `synced-models=${syncedLabels.join(', ')}\n`,
            { flag: 'a' }
          )
          GENERATOR_EOF
        shell: bash

      - name: Regenerate the .apdu artifacts
        id: generate
        run: node generate-apdu-artifacts.mjs
        shell: bash

      - name: Remove the artifact generator and downloads
        run: rm -rf generate-apdu-artifacts.mjs "${DOWNLOAD_DIR}"
        shell: bash

      - name: Open a pull request 🚀
        uses: peter-evans/create-pull-request@v7
        with:
          # GITHUB_TOKEN requires "Allow GitHub Actions to create and approve pull
          # requests" to be enabled in the repository Actions settings.
          token: ${{ secrets.GITHUB_TOKEN }}
          base: feature/ledger-7702
          branch: automated/ledger-ambire-signer-apdu
          # Reuse the same branch so repeated runs update one pull request instead
          # of piling up a new one per build.
          delete-branch: true
          commit-message: 'chore: sync Ledger "Ambire Signer" .apdu load scripts'
          title: 'chore: sync Ledger "Ambire Signer" .apdu load scripts'
          body: |
            Regenerated the per-device "Ambire Signer" load scripts from a fresh
            [ledger-ambire-signer](https://github.com/${{ env.SIGNER_REPOSITORY }}) build.

            - Synced devices: ${{ steps.generate.outputs.synced-models }}
            - Built from: `${{ inputs.signer_ref || 'feat/apa/add_contracts_in_7702_whitelist' }}`
            - Build run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Before merging, validate each build against the checks described in
            `artifacts/index.ts` (app name "Ambire Signer" + Ambire delegator whitelisted).
          labels: automated
