# Reusable Mobilewright iOS suite — runs ONE shard against the prebuilt iOS simulator
# .app (the `ambire-ios-v*-simulator` artifact produced by the caller's `build-ios` job,
# via ./.github/workflows/_build-ios.yml, in the same run). Parameterized so every shard
# shares a single step definition, mirroring ./_e2e-suite.yml for Playwright.
name: The reusable Mobilewright iOS suite

on:
  workflow_call:
    inputs:
      suite:
        description: 'Suite name — used for the uploaded blob-report artifact name'
        required: true
        type: string
      command:
        description: 'The mobilewright test command to run (e.g. "npx mobilewright test --project=ios --shard=1/2 --reporter=blob")'
        required: true
        type: string

env:
  IS_TESTING: 'true'
  RELAYER_URL: ${{ vars.RELAYER_URL }}
  VELCRO_URL: ${{ vars.VELCRO_URL }}
  BA_ACCOUNTS: ${{ vars.BA_ACCOUNTS }}
  BA_KEYSTORE_UID: ${{ vars.BA_KEYSTORE_UID }}
  BA_KEYS: ${{ vars.BA_KEYS }}
  BA_SEEDS: ${{ vars.BA_SEEDS }}
  BA_LEARNED_ASSETS: ${{ vars.BA_LEARNED_ASSETS }}
  BA_SELECTED_ACCOUNT: ${{ vars.BA_SELECTED_ACCOUNT }}
  SA_ACCOUNTS: ${{ vars.SA_ACCOUNTS }}
  SA_KEYSTORE_UID: ${{ vars.SA_KEYSTORE_UID }}
  SA_KEYS: ${{ vars.SA_KEYS }}
  SA_SEEDS: ${{ vars.SA_SEEDS }}
  SA_LEARNED_ASSETS: ${{ vars.SA_LEARNED_ASSETS }}
  SA_SELECTED_ACCOUNT: ${{ vars.SA_SELECTED_ACCOUNT }}
  DEFAULT_INVITATION_CODE_DEV: ${{ vars.DEFAULT_INVITATION_CODE_DEV }}

jobs:
  run:
    name: iOS · ${{ inputs.suite }}
    # NOTE: macos-15 runners are Apple Silicon (arm64) — must match the runner _build-ios.yml
    # used, since the simulator .app is built arm64 and only boots on an arm64 host.
    runs-on: macos-15
    environment: testing
    env:
      PWTEST_BLOB_REPORT_NAME: ${{ inputs.suite }}
      KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
      SEED: ${{ secrets.SEED }}
      SEED_24_WORDS: ${{ secrets.SEED_24_WORDS }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      BA_SECRETS: ${{ secrets.BA_SECRETS }}
      SA_SECRETS: ${{ secrets.SA_SECRETS }}
      SA_ACCOUNT_JSON: ${{ secrets.SA_ACCOUNT_JSON }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install Node.js ⚙️
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
          cache-dependency-path: e2e-playwright-tests/yarn.lock

      # The mobile specs import shared helpers from the parent e2e-playwright-tests
      # package (constants/*, @helpers/*, utils/env/*), so its deps must be installed too.
      - name: Install shared e2e dependencies
        working-directory: ./e2e-playwright-tests
        run: yarn install --frozen-lockfile && yarn postinstall

      - name: Install Mobilewright test dependencies
        working-directory: ./e2e-playwright-tests/e2e-mobile-tests
        run: npm ci

      - name: Download iOS build artifact
        uses: actions/download-artifact@v6
        with:
          pattern: 'ambire-ios-v*-simulator'
          path: ./ios-build
          merge-multiple: true

      - name: Stage iOS build
        shell: bash
        run: |
          set -euo pipefail
          ZIP_PATH=$(find ./ios-build -maxdepth 1 -type f -name '*.zip' | head -n1)
          if [ -z "$ZIP_PATH" ]; then
            echo "No iOS build zip found in ./ios-build"
            ls -la ./ios-build || true
            exit 1
          fi
          # mobilecli installs onto a simulator from a .zip of the .app bundle, so keep
          # the zip as-is — do NOT unzip. Path matches installApps: './Ambire-sim.zip'
          # in mobilewright.config.ts.
          cp "$ZIP_PATH" ./e2e-playwright-tests/e2e-mobile-tests/Ambire-sim.zip

      - name: Read Xcode version from .xcode-version
        id: xcode_version
        run: echo "XCODE_VERSION=$(cat .xcode-version | tr -d ' \n')" >> $GITHUB_OUTPUT
        shell: bash

      # Match the Xcode/simulator runtime the build used, so the .app is guaranteed
      # to be compatible with whatever simulator we boot below.
      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ steps.xcode_version.outputs.XCODE_VERSION }}

      - name: Boot iOS Simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '.devices | to_entries[] | .value[] | select(.name | test("iPhone")) | .udid' \
            | head -n1)
          if [ -z "$UDID" ]; then
            echo "No available iPhone simulator found on this runner image"
            xcrun simctl list devices available
            exit 1
          fi
          echo "UDID=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      - name: Run Mobilewright tests (${{ inputs.suite }})
        working-directory: ./e2e-playwright-tests/e2e-mobile-tests
        run: ${{ inputs.command }}

      - name: Shutdown simulator
        if: always()
        shell: bash
        run: xcrun simctl shutdown "${{ steps.simulator.outputs.UDID }}" || true

      - name: Upload ${{ inputs.suite }} blob report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mobilewright-blob-report-${{ inputs.suite }}
          path: ./e2e-playwright-tests/e2e-mobile-tests/blob-report/
          retention-days: 14
