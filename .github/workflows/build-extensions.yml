name: 🌐 Build · Browser Extensions

on:
  workflow_dispatch: # Manual trigger
  release:
    types: [published] # Triggers on new releases (from any branch)

jobs:
  build:
    name: Build ${{ matrix.artifact_suffix }} extension .zips, ready for review submission
    runs-on: ${{ matrix.runner }}
    strategy:
      # Don't cancel the other variants if one fails (important for releases)
      fail-fast: false
      matrix:
        include:
          - environment: extension-production
            build_variant: webkit
            artifact_suffix: webkit
            runner: ubuntu-24.04
          - environment: extension-production-next
            build_variant: next:webkit
            artifact_suffix: next-webkit
            runner: ubuntu-24.04
          # gecko must be built natively on ARM64, otherwise Firefox can't
          # reproduce the build during review. Native arm64 standard runners
          # became available for private repositories on 2026-01-29, which let
          # us drop the previous QEMU-based emulation workflow.
          - environment: extension-production
            build_variant: gecko
            artifact_suffix: gecko
            runner: ubuntu-24.04-arm
    environment: ${{ matrix.environment }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.build_variant }}
    steps:
      - name: Checkout code 🛎️
        uses: actions/checkout@v6

      - name: Add SSH key to checkout a private repo
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Git submodules init
        run: git submodule init
        shell: bash

      - name: Git submodules update
        run: git submodule update
        shell: bash

      - name: Install Node.js ⚙️
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Install Dependencies
        run: yarn setup:ci
        shell: bash

      - name: Generate .env file for review
        run: |
          echo "RELAYER_URL=\"${{ vars.RELAYER_URL }}\"" >> .env
          echo "VELCRO_URL=\"${{ vars.VELCRO_URL }}\"" >> .env
          echo "BROWSER_EXTENSION_PUBLIC_KEY=\"${{ vars.BROWSER_EXTENSION_PUBLIC_KEY }}\"" >> .env
          echo "REACT_APP_PIMLICO_API_KEY=\"${{ vars.REACT_APP_PIMLICO_API_KEY }}\"" >> .env
          echo "REACT_APP_ETHERSPOT_API_KEY=\"${{ vars.REACT_APP_ETHERSPOT_API_KEY }}\"" >> .env
          echo "REACT_APP_CANDIDE_API_KEY=\"${{ vars.REACT_APP_CANDIDE_API_KEY }}\"" >> .env
          echo "REACT_APP_GELATO_API_KEY=\"${{ vars.REACT_APP_GELATO_API_KEY }}\"" >> .env
          echo "NFT_CDN_URL=\"${{ vars.NFT_CDN_URL }}\"" >> .env
          echo "LEGENDS_NFT_ADDRESS=\"${{ vars.LEGENDS_NFT_ADDRESS }}\"" >> .env
          echo "LI_FI_API_KEY=\"${{ vars.LI_FI_API_KEY }}\"" >> .env
          echo "BUNGEE_API_KEY=\"${{ vars.BUNGEE_API_KEY }}\"" >> .env
          echo "SQUID_INTEGRATOR_ID=\"${{ vars.SQUID_INTEGRATOR_ID }}\"" >> .env
          echo "UNISWAP_API_KEY=\"${{ vars.UNISWAP_API_KEY }}\"" >> .env
          echo "SAFE_API_KEY=\"${{ vars.SAFE_API_KEY }}\"" >> .env
          echo "WALLETCONNECT_PROJECT_ID=\"${{ vars.WALLETCONNECT_PROJECT_ID }}\"" >> .env
          echo "SENTRY_DSN_BROWSER_EXTENSION=\"${{ vars.SENTRY_DSN_BROWSER_EXTENSION }}\"" >> .env
        shell: bash

      - name: Get version from app.json
        id: version
        run: echo "VERSION=$(grep '"version"' ./app.json | head -n1 | cut -d':' -f2 | tr -d ' ",')" >> $GITHUB_OUTPUT
        shell: bash

      - name: Build extensions and upload source maps to Sentry
        env:
          RELAYER_URL: ${{ vars.RELAYER_URL }}
          VELCRO_URL: ${{ vars.VELCRO_URL }}
          BROWSER_EXTENSION_PUBLIC_KEY: ${{ vars.BROWSER_EXTENSION_PUBLIC_KEY }}
          REACT_APP_PIMLICO_API_KEY: ${{ vars.REACT_APP_PIMLICO_API_KEY }}
          REACT_APP_ETHERSPOT_API_KEY: ${{ vars.REACT_APP_ETHERSPOT_API_KEY }}
          REACT_APP_CANDIDE_API_KEY: ${{ vars.REACT_APP_CANDIDE_API_KEY }}
          REACT_APP_GELATO_API_KEY: ${{ vars.REACT_APP_GELATO_API_KEY }}
          NFT_CDN_URL: ${{ vars.NFT_CDN_URL }}
          LEGENDS_NFT_ADDRESS: ${{ vars.LEGENDS_NFT_ADDRESS }}
          LI_FI_API_KEY: ${{ vars.LI_FI_API_KEY }}
          BUNGEE_API_KEY: ${{ vars.BUNGEE_API_KEY }}
          SQUID_INTEGRATOR_ID: ${{ vars.SQUID_INTEGRATOR_ID }}
          UNISWAP_API_KEY: ${{ vars.UNISWAP_API_KEY }}
          SAFE_API_KEY: ${{ vars.SAFE_API_KEY }}
          WALLETCONNECT_PROJECT_ID: ${{ vars.WALLETCONNECT_PROJECT_ID }}
          SENTRY_DSN_BROWSER_EXTENSION: ${{ vars.SENTRY_DSN_BROWSER_EXTENSION }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN_BROWSER_EXTENSIONS }}
        run: yarn build:extensions:${{ matrix.build_variant }}

      # Firefox requires the full source code (including .env) to reproduce the
      # build during review, so this is only needed for the gecko variant.
      - name: Generate .zip with the full source code (including .env)
        if: matrix.build_variant == 'gecko'
        run: |
          zip -r extension-source-code.zip . -x "node_modules/*" -x ".git/*" -x "build/*" -x "*.zip" -x "src/legends/*"
        shell: bash

      # Named so that it can never be mistaken for a release asset - it must stay
      # a CI-only artifact, downloaded by hand for the Firefox review.
      - name: Upload source code 📦
        if: matrix.build_variant == 'gecko'
        uses: actions/upload-artifact@v6
        with:
          name: firefox-review-source-code-v${{ steps.version.outputs.VERSION }}
          path: ./extension-source-code.zip

      # Everything matching ambire-extension-* is published as a release asset,
      # so this artifact holds the extension .zip and nothing else.
      - name: Upload extension build 📦
        uses: actions/upload-artifact@v6
        with:
          name: ambire-extension-v${{ steps.version.outputs.VERSION }}-${{ matrix.artifact_suffix }}
          path: |
            ./build/*.zip
            !./build/*-source-maps.zip

      # Source maps are uploaded to Sentry during the build; this artifact is just
      # a CI-only copy, kept out of the releases.
      - name: Upload source maps 📦
        uses: actions/upload-artifact@v6
        with:
          name: sourcemaps-v${{ steps.version.outputs.VERSION }}-${{ matrix.artifact_suffix }}
          path: ./build/*-source-maps.zip

  publish-release-assets:
    name: Attach the built .zips to the GitHub releases
    needs: build
    # Manual runs are used for store submissions, where there is no release to attach to.
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Needed to upload assets to this repo's release
    env:
      TAG: ${{ github.event.release.tag_name }}
      PUBLIC_REPO: AmbireTech/extension
    steps:
      - name: Download the built extension .zips 📥
        uses: actions/download-artifact@v6
        with:
          path: assets
          merge-multiple: true
          # Only the extension builds. NEVER the source code artifact - it bundles
          # the .env file with our API keys and exists solely for the Firefox reviewers.
          pattern: 'ambire-extension-*'

      # Kept out of the public release, but attached to this repo's one, because
      # CI artifacts expire after 90 days while release assets don't.
      - name: Download the source maps 📥
        uses: actions/download-artifact@v6
        with:
          path: sourcemaps
          merge-multiple: true
          pattern: 'sourcemaps-*'

      - name: Verify what is about to be published
        run: |
          set -euo pipefail
          cd assets

          if compgen -G '*source-code*' > /dev/null; then
            echo "::error::A source code archive slipped into the release assets - it contains .env secrets"
            exit 1
          fi

          if compgen -G '*-source-maps.zip' > /dev/null; then
            echo "::error::Source maps are not published as release assets"
            exit 1
          fi

          # One .zip per build variant. Publishing an incomplete set is
          # unrecoverable once the release is immutable.
          ZIP_COUNT=$(ls -1 *.zip | wc -l | tr -d ' ')
          if [ "$ZIP_COUNT" -ne 3 ]; then
            echo "::error::Expected 3 .zip assets, got $ZIP_COUNT"
            ls -la
            exit 1
          fi
        shell: bash

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd assets
          sha256sum *.zip | LC_ALL=C sort -k 2 > SHA256SUMS
          cat SHA256SUMS
        shell: bash

      - name: Attach the assets to this repo's release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" assets/*.zip assets/SHA256SUMS sourcemaps/*.zip --clobber
        shell: bash

      # The public repo is where users download from, so its releases are the ones
      # that must be immutable (and therefore signed by GitHub). Immutable releases
      # lock their assets on publish, so everything is attached to a draft and a
      # human publishes it after a look.
      - name: Create the public repo draft release with the same assets
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_RELEASE_TOKEN }}
          RELEASE_TITLE: ${{ github.event.release.name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$PUBLIC_REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" assets/*.zip assets/SHA256SUMS --repo "$PUBLIC_REPO" --clobber
            exit 0
          fi

          # Passed through a file, because release notes contain characters that
          # would break (or be interpreted by) the shell.
          printf '%s' "$RELEASE_BODY" > release-notes.md

          PRERELEASE_FLAG=()
          if [ "$IS_PRERELEASE" = "true" ]; then
            PRERELEASE_FLAG=(--prerelease)
          fi

          # --target is only used when the tag isn't mirrored to the public repo yet.
          # It fails if the release commit isn't there, which is the correct outcome:
          # the public repo must never hold a release pointing at unmirrored code.
          gh release create "$TAG" assets/*.zip assets/SHA256SUMS \
            --repo "$PUBLIC_REPO" \
            --draft \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TITLE" \
            --notes-file release-notes.md \
            "${PRERELEASE_FLAG[@]}"
        shell: bash
