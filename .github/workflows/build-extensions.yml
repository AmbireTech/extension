name: 🌐 Build · Browser Extensions

on:
  workflow_dispatch: # Manual trigger
    inputs:
      # Releases submit Ambire Next on their own, so this is only the escape
      # hatch for a submission that failed after the build had already passed
      # (e.g. an expired Chrome Web Store refresh token). It also bypasses the
      # "the store already has a newer version" guard.
      submit_next_to_chrome_web_store:
        description: 'Force submitting the Ambire Next build to the Chrome Web Store for review'
        type: boolean
        default: false
  release:
    types: [published] # Triggers on new releases (from any branch)

jobs:
  build:
    name: Build ${{ matrix.artifact_suffix }} extension .zips, ready for review submission
    runs-on: ${{ matrix.runner }}
    strategy:
      # Don't cancel the other variants if one fails (important for releases)
      fail-fast: false
      matrix:
        include:
          - environment: extension-production
            build_variant: webkit
            artifact_suffix: webkit
            runner: ubuntu-24.04
          - environment: extension-production-next
            build_variant: next:webkit
            artifact_suffix: next-webkit
            runner: ubuntu-24.04
          # gecko must be built natively on ARM64, otherwise Firefox can't
          # reproduce the build during review. Native arm64 standard runners
          # became available for private repositories on 2026-01-29, which let
          # us drop the previous QEMU-based emulation workflow.
          - environment: extension-production
            build_variant: gecko
            artifact_suffix: gecko
            runner: ubuntu-24.04-arm
    environment: ${{ matrix.environment }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.build_variant }}
    steps:
      - name: Checkout code 🛎️
        uses: actions/checkout@v6

      - name: Add SSH key to checkout a private repo
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Git submodules init
        run: git submodule init
        shell: bash

      - name: Git submodules update
        run: git submodule update
        shell: bash

      - name: Install Node.js ⚙️
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Install Dependencies
        run: yarn setup:ci
        shell: bash

      - name: Generate .env file for review
        run: |
          echo "RELAYER_URL=\"${{ vars.RELAYER_URL }}\"" >> .env
          echo "VELCRO_URL=\"${{ vars.VELCRO_URL }}\"" >> .env
          echo "BROWSER_EXTENSION_PUBLIC_KEY=\"${{ vars.BROWSER_EXTENSION_PUBLIC_KEY }}\"" >> .env
          echo "REACT_APP_PIMLICO_API_KEY=\"${{ vars.REACT_APP_PIMLICO_API_KEY }}\"" >> .env
          echo "REACT_APP_ETHERSPOT_API_KEY=\"${{ vars.REACT_APP_ETHERSPOT_API_KEY }}\"" >> .env
          echo "REACT_APP_CANDIDE_API_KEY=\"${{ vars.REACT_APP_CANDIDE_API_KEY }}\"" >> .env
          echo "REACT_APP_GELATO_API_KEY=\"${{ vars.REACT_APP_GELATO_API_KEY }}\"" >> .env
          echo "NFT_CDN_URL=\"${{ vars.NFT_CDN_URL }}\"" >> .env
          echo "LEGENDS_NFT_ADDRESS=\"${{ vars.LEGENDS_NFT_ADDRESS }}\"" >> .env
          echo "LI_FI_API_KEY=\"${{ vars.LI_FI_API_KEY }}\"" >> .env
          echo "BUNGEE_API_KEY=\"${{ vars.BUNGEE_API_KEY }}\"" >> .env
          echo "UNISWAP_API_KEY=\"${{ vars.UNISWAP_API_KEY }}\"" >> .env
          echo "SAFE_API_KEY=\"${{ vars.SAFE_API_KEY }}\"" >> .env
          echo "WALLETCONNECT_PROJECT_ID=\"${{ vars.WALLETCONNECT_PROJECT_ID }}\"" >> .env
          echo "SENTRY_DSN_BROWSER_EXTENSION=\"${{ vars.SENTRY_DSN_BROWSER_EXTENSION }}\"" >> .env
        shell: bash

      - name: Get version from app.json
        id: version
        run: echo "VERSION=$(grep '"version"' ./app.json | head -n1 | cut -d':' -f2 | tr -d ' ",')" >> $GITHUB_OUTPUT
        shell: bash

      - name: Build extensions and upload source maps to Sentry
        env:
          RELAYER_URL: ${{ vars.RELAYER_URL }}
          VELCRO_URL: ${{ vars.VELCRO_URL }}
          BROWSER_EXTENSION_PUBLIC_KEY: ${{ vars.BROWSER_EXTENSION_PUBLIC_KEY }}
          REACT_APP_PIMLICO_API_KEY: ${{ vars.REACT_APP_PIMLICO_API_KEY }}
          REACT_APP_ETHERSPOT_API_KEY: ${{ vars.REACT_APP_ETHERSPOT_API_KEY }}
          REACT_APP_CANDIDE_API_KEY: ${{ vars.REACT_APP_CANDIDE_API_KEY }}
          REACT_APP_GELATO_API_KEY: ${{ vars.REACT_APP_GELATO_API_KEY }}
          NFT_CDN_URL: ${{ vars.NFT_CDN_URL }}
          LEGENDS_NFT_ADDRESS: ${{ vars.LEGENDS_NFT_ADDRESS }}
          LI_FI_API_KEY: ${{ vars.LI_FI_API_KEY }}
          BUNGEE_API_KEY: ${{ vars.BUNGEE_API_KEY }}
          UNISWAP_API_KEY: ${{ vars.UNISWAP_API_KEY }}
          SAFE_API_KEY: ${{ vars.SAFE_API_KEY }}
          WALLETCONNECT_PROJECT_ID: ${{ vars.WALLETCONNECT_PROJECT_ID }}
          SENTRY_DSN_BROWSER_EXTENSION: ${{ vars.SENTRY_DSN_BROWSER_EXTENSION }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN_BROWSER_EXTENSIONS }}
        run: yarn build:extensions:${{ matrix.build_variant }}

      # Firefox requires the full source code (including .env) to reproduce the
      # build during review, so this is only needed for the gecko variant.
      - name: Generate .zip with the full source code (including .env)
        if: matrix.build_variant == 'gecko'
        run: |
          zip -r extension-source-code.zip . -x "node_modules/*" -x ".git/*" -x "build/*" -x "*.zip" -x "src/legends/*"
        shell: bash

      # Named so that it can never be mistaken for a release asset - it must stay
      # a CI-only artifact, downloaded by hand for the Firefox review.
      - name: Upload source code 📦
        if: matrix.build_variant == 'gecko'
        uses: actions/upload-artifact@v6
        with:
          name: firefox-review-source-code-v${{ steps.version.outputs.VERSION }}
          path: ./extension-source-code.zip

      # Everything matching ambire-extension-* is published as a release asset,
      # so this artifact holds the extension .zip and nothing else.
      - name: Upload extension build 📦
        uses: actions/upload-artifact@v6
        with:
          name: ambire-extension-v${{ steps.version.outputs.VERSION }}-${{ matrix.artifact_suffix }}
          path: |
            ./build/*.zip
            !./build/*-source-maps.zip

      # Source maps are uploaded to Sentry during the build; this artifact is just
      # a CI-only copy, kept out of the releases.
      - name: Upload source maps 📦
        uses: actions/upload-artifact@v6
        with:
          name: sourcemaps-v${{ steps.version.outputs.VERSION }}-${{ matrix.artifact_suffix }}
          path: ./build/*-source-maps.zip

      # Only Ambire Next is submitted automatically, because it is the variant
      # that gets released most often. The production webkit and gecko builds are
      # still submitted by hand, as their reviews need extra care (e.g. the
      # separate source code .zip that Firefox requires).
      # Runs on every published release, so the .zip that goes to the store is
      # the very same one this run attaches to the release and covers with
      # SHA256SUMS. Submitting from a separate manual run would break that.
      # Kept last, and non-blocking: a store submission can always be redone by
      # hand, while a failed job would take publish-release-assets down with it
      # and leave the release without its .zips and SHA256SUMS. The step still
      # reports ::error:: annotations, so a failure stays visible in the run.
      - name: Submit Ambire Next to the Chrome Web Store for review 🚀
        if: matrix.build_variant == 'next:webkit' && (github.event_name == 'release' || inputs.submit_next_to_chrome_web_store)
        continue-on-error: true
        env:
          BROWSER_EXTENSION_PUBLIC_KEY: ${{ vars.BROWSER_EXTENSION_PUBLIC_KEY }}
          PUBLISHER_ID: ${{ vars.CHROME_WEB_STORE_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CHROME_WEB_STORE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_WEB_STORE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_WEB_STORE_REFRESH_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          # The build also produces a -source-maps.zip, so the extension one must
          # be picked explicitly
          ZIP="./build/ambire-extension-v${VERSION}-next-webkit.zip"
          test -f "$ZIP" || { echo "::error::Extension .zip not found: $ZIP"; exit 1; }

          # The store item ID is derived from the very same public key that
          # webpack writes into manifest.key, so it is never hardcoded here:
          # Chrome takes the first 128 bits of the key's SHA-256 and remaps the
          # hex digits 0-f onto the letters a-p. Because every build variant
          # reads its key from its own GitHub environment, this step stays
          # correct if it is ever enabled for the stable build too.
          test -n "$BROWSER_EXTENSION_PUBLIC_KEY" || { echo "::error::BROWSER_EXTENSION_PUBLIC_KEY is empty, so the Chrome Web Store item ID cannot be derived."; exit 1; }
          ITEM_ID=$(printf '%s' "$BROWSER_EXTENSION_PUBLIC_KEY" | base64 -d | sha256sum | head -c 32 | tr '0-9a-f' 'a-p')
          echo "Derived Chrome Web Store item ID: $ITEM_ID"

          test -n "$PUBLISHER_ID" || { echo "::error::CHROME_WEB_STORE_PUBLISHER_ID is empty. Copy it from Publisher > Settings in the Chrome Web Store Developer Dashboard into the environment's variables."; exit 1; }
          ITEM="publishers/$PUBLISHER_ID/items/$ITEM_ID"

          ACCESS_TOKEN=$(curl -s --fail-with-body -X POST https://oauth2.googleapis.com/token \
            -d "client_id=$CLIENT_ID" \
            -d "client_secret=$CLIENT_SECRET" \
            -d "refresh_token=$REFRESH_TOKEN" \
            -d "grant_type=refresh_token" | jq -er '.access_token') \
            || { echo "::error::Could not refresh the Chrome Web Store access token. Note that the refresh token silently expires after 7 days while the Google OAuth consent screen is in Testing mode. Publish the consent screen (or set it to Internal) and generate a new refresh token."; exit 1; }

          fetch_status() {
            curl -s --fail-with-body \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              "https://chromewebstore.googleapis.com/v2/$ITEM:fetchStatus"
          }

          # A production hotfix (say v6.20.4) can be tagged while Ambire Next is
          # already on v6.21.0. The store keeps a single draft slot, so uploading
          # the older build would overwrite the newer one - possibly one that is
          # still in review, which is why the submitted revision counts here just
          # as much as the published one. Manual runs skip this guard on purpose,
          # so that a submission that failed halfway can be retried.
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            STORE_VERSION=$(fetch_status \
              | jq -r '[.publishedItemRevisionStatus, .submittedItemRevisionStatus] | map(.distributionChannels[]?.crxVersion // empty) | .[]' \
              | sort -V | tail -n1)
            echo "Highest version currently in the store: ${STORE_VERSION:-none}"

            # sort -V puts the higher version last, so the store wins on ties too
            if [ -n "$STORE_VERSION" ] && [ "$(printf '%s\n%s\n' "$VERSION" "$STORE_VERSION" | sort -V | tail -n1)" = "$STORE_VERSION" ]; then
              echo "::notice::Skipped the Chrome Web Store submission: the store already holds v$STORE_VERSION, which is not older than this build's v$VERSION."
              exit 0
            fi
          fi

          echo "Uploading $ZIP as a new version of item $ITEM_ID"
          UPLOAD=$(curl -s --fail-with-body -X POST -T "$ZIP" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://chromewebstore.googleapis.com/upload/v2/$ITEM:upload") \
            || { echo "::error::Uploading the package failed: $UPLOAD"; exit 1; }
          echo "$UPLOAD"
          UPLOAD_STATE=$(jq -r '.uploadState // empty' <<< "$UPLOAD")

          # The store may process the package asynchronously and answer with
          # IN_PROGRESS, in which case publishing right away would submit the
          # previous package.
          ATTEMPT=0
          while [ "$UPLOAD_STATE" != "SUCCEEDED" ] && [ "$UPLOAD_STATE" != "FAILED" ]; do
            ATTEMPT=$((ATTEMPT + 1))
            [ "$ATTEMPT" -le 20 ] || { echo "::error::The package upload was still not processed after 5 minutes (last state: ${UPLOAD_STATE:-unknown})."; exit 1; }
            sleep 15
            UPLOAD_STATE=$(fetch_status | jq -r '.lastAsyncUploadState // empty')
            echo "Upload state: ${UPLOAD_STATE:-unknown}"
          done
          [ "$UPLOAD_STATE" = "SUCCEEDED" ] || { echo "::error::The Chrome Web Store rejected the uploaded package. Check the item in the Developer Dashboard for the reason."; exit 1; }

          echo "Submitting version $VERSION for review"
          # STAGED_PUBLISH holds the approved version instead of pushing it live,
          # so we pick the go-live moment ourselves with the Publish button in the
          # Developer Dashboard. Mind the deadline: an approved submission that is
          # not published within 30 days falls back to a draft and has to go
          # through review again. Swap in DEFAULT_PUBLISH to go live on approval.
          PUBLISH=$(curl -s --fail-with-body -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"publishType": "STAGED_PUBLISH"}' \
            "https://chromewebstore.googleapis.com/v2/$ITEM:publish") \
            || { echo "::error::Submitting for review failed: $PUBLISH"; exit 1; }
          echo "$PUBLISH"

          # A submission that skipped review comes back STAGED instead of PENDING_REVIEW
          case "$(jq -r '.state // empty' <<< "$PUBLISH")" in
            PENDING_REVIEW|STAGED) ;;
            *) echo "::error::Unexpected state after submitting: $(jq -r '.state // "none"' <<< "$PUBLISH")"; exit 1 ;;
          esac

          echo "✅ Ambire Next v${VERSION} submitted for review. Once it is approved, press Publish in the Developer Dashboard to take it live."
        shell: bash

  publish-release-assets:
    name: Attach the built .zips to the GitHub releases
    needs: build
    # Manual runs are used for store submissions, where there is no release to attach to.
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Needed to upload assets to this repo's release
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Download the built extension .zips 📥
        uses: actions/download-artifact@v6
        with:
          path: assets
          merge-multiple: true
          # Only the extension builds. NEVER the source code artifact - it bundles
          # the .env file with our API keys and exists solely for the Firefox reviewers.
          pattern: 'ambire-extension-*'

      # Kept out of the public release, but attached to this repo's one, because
      # CI artifacts expire after 90 days while release assets don't.
      - name: Download the source maps 📥
        uses: actions/download-artifact@v6
        with:
          path: sourcemaps
          merge-multiple: true
          pattern: 'sourcemaps-*'

      - name: Verify what is about to be published
        run: |
          set -euo pipefail
          cd assets

          if compgen -G '*source-code*' > /dev/null; then
            echo "::error::A source code archive slipped into the release assets - it contains .env secrets"
            exit 1
          fi

          if compgen -G '*-source-maps.zip' > /dev/null; then
            echo "::error::Source maps are not published as release assets"
            exit 1
          fi

          # One .zip per build variant. Publishing an incomplete set is
          # unrecoverable once the release is immutable.
          ZIP_COUNT=$(ls -1 *.zip | wc -l | tr -d ' ')
          if [ "$ZIP_COUNT" -ne 3 ]; then
            echo "::error::Expected 3 .zip assets, got $ZIP_COUNT"
            ls -la
            exit 1
          fi
        shell: bash

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd assets
          sha256sum *.zip | LC_ALL=C sort -k 2 > SHA256SUMS
          cat SHA256SUMS
        shell: bash

      - name: Attach the assets to this repo's release
        env:
          GH_TOKEN: ${{ github.token }}
        # --repo is required: gh resolves the repository from a git remote or from
        # --repo/GH_REPO, and this job has no checkout (it only needs the artifacts).
        run: gh release upload "$TAG" assets/*.zip assets/SHA256SUMS sourcemaps/*.zip --repo "$GITHUB_REPOSITORY" --clobber
        shell: bash
