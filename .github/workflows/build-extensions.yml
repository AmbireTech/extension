name: 🌐 Build · Browser Extensions

on:
  workflow_dispatch: # Manual trigger
    inputs:
      submit_next_to_chrome_web_store:
        description: 'Submit the Ambire Next build to the Chrome Web Store for review'
        type: boolean
        default: false
  release:
    types: [published] # Triggers on new releases (from any branch)

jobs:
  build:
    name: Build ${{ matrix.artifact_suffix }} extension .zips, ready for review submission
    runs-on: ${{ matrix.runner }}
    strategy:
      # Don't cancel the other variants if one fails (important for releases)
      fail-fast: false
      matrix:
        include:
          - environment: extension-production
            build_variant: webkit
            artifact_suffix: webkit
            runner: ubuntu-24.04
          - environment: extension-production-next
            build_variant: next:webkit
            artifact_suffix: next-webkit
            runner: ubuntu-24.04
          # gecko must be built natively on ARM64, otherwise Firefox can't
          # reproduce the build during review. Native arm64 standard runners
          # became available for private repositories on 2026-01-29, which let
          # us drop the previous QEMU-based emulation workflow.
          - environment: extension-production
            build_variant: gecko
            artifact_suffix: gecko
            runner: ubuntu-24.04-arm
    environment: ${{ matrix.environment }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.build_variant }}
    steps:
      - name: Checkout code 🛎️
        uses: actions/checkout@v6

      - name: Add SSH key to checkout a private repo
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Git submodules init
        run: git submodule init
        shell: bash

      - name: Git submodules update
        run: git submodule update
        shell: bash

      - name: Install Node.js ⚙️
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Install Dependencies
        run: yarn setup:ci
        shell: bash

      - name: Generate .env file for review
        run: |
          echo "RELAYER_URL=\"${{ vars.RELAYER_URL }}\"" >> .env
          echo "VELCRO_URL=\"${{ vars.VELCRO_URL }}\"" >> .env
          echo "BROWSER_EXTENSION_PUBLIC_KEY=\"${{ vars.BROWSER_EXTENSION_PUBLIC_KEY }}\"" >> .env
          echo "REACT_APP_PIMLICO_API_KEY=\"${{ vars.REACT_APP_PIMLICO_API_KEY }}\"" >> .env
          echo "REACT_APP_ETHERSPOT_API_KEY=\"${{ vars.REACT_APP_ETHERSPOT_API_KEY }}\"" >> .env
          echo "REACT_APP_CANDIDE_API_KEY=\"${{ vars.REACT_APP_CANDIDE_API_KEY }}\"" >> .env
          echo "REACT_APP_GELATO_API_KEY=\"${{ vars.REACT_APP_GELATO_API_KEY }}\"" >> .env
          echo "NFT_CDN_URL=\"${{ vars.NFT_CDN_URL }}\"" >> .env
          echo "LEGENDS_NFT_ADDRESS=\"${{ vars.LEGENDS_NFT_ADDRESS }}\"" >> .env
          echo "LI_FI_API_KEY=\"${{ vars.LI_FI_API_KEY }}\"" >> .env
          echo "BUNGEE_API_KEY=\"${{ vars.BUNGEE_API_KEY }}\"" >> .env
          echo "SQUID_INTEGRATOR_ID=\"${{ vars.SQUID_INTEGRATOR_ID }}\"" >> .env
          echo "UNISWAP_API_KEY=\"${{ vars.UNISWAP_API_KEY }}\"" >> .env
          echo "SAFE_API_KEY=\"${{ vars.SAFE_API_KEY }}\"" >> .env
          echo "WALLETCONNECT_PROJECT_ID=\"${{ vars.WALLETCONNECT_PROJECT_ID }}\"" >> .env
          echo "SENTRY_DSN_BROWSER_EXTENSION=\"${{ vars.SENTRY_DSN_BROWSER_EXTENSION }}\"" >> .env
        shell: bash

      - name: Get version from app.json
        id: version
        run: echo "VERSION=$(grep '"version"' ./app.json | head -n1 | cut -d':' -f2 | tr -d ' ",')" >> $GITHUB_OUTPUT
        shell: bash

      - name: Build extensions and upload source maps to Sentry
        env:
          RELAYER_URL: ${{ vars.RELAYER_URL }}
          VELCRO_URL: ${{ vars.VELCRO_URL }}
          BROWSER_EXTENSION_PUBLIC_KEY: ${{ vars.BROWSER_EXTENSION_PUBLIC_KEY }}
          REACT_APP_PIMLICO_API_KEY: ${{ vars.REACT_APP_PIMLICO_API_KEY }}
          REACT_APP_ETHERSPOT_API_KEY: ${{ vars.REACT_APP_ETHERSPOT_API_KEY }}
          REACT_APP_CANDIDE_API_KEY: ${{ vars.REACT_APP_CANDIDE_API_KEY }}
          REACT_APP_GELATO_API_KEY: ${{ vars.REACT_APP_GELATO_API_KEY }}
          NFT_CDN_URL: ${{ vars.NFT_CDN_URL }}
          LEGENDS_NFT_ADDRESS: ${{ vars.LEGENDS_NFT_ADDRESS }}
          LI_FI_API_KEY: ${{ vars.LI_FI_API_KEY }}
          BUNGEE_API_KEY: ${{ vars.BUNGEE_API_KEY }}
          SQUID_INTEGRATOR_ID: ${{ vars.SQUID_INTEGRATOR_ID }}
          UNISWAP_API_KEY: ${{ vars.UNISWAP_API_KEY }}
          SAFE_API_KEY: ${{ vars.SAFE_API_KEY }}
          WALLETCONNECT_PROJECT_ID: ${{ vars.WALLETCONNECT_PROJECT_ID }}
          SENTRY_DSN_BROWSER_EXTENSION: ${{ vars.SENTRY_DSN_BROWSER_EXTENSION }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN_BROWSER_EXTENSIONS }}
        run: yarn build:extensions:${{ matrix.build_variant }}

      # Firefox requires the full source code (including .env) to reproduce the
      # build during review, so this is only needed for the gecko variant.
      - name: Generate .zip with the full source code (including .env)
        if: matrix.build_variant == 'gecko'
        run: |
          zip -r extension-source-code.zip . -x "node_modules/*" -x ".git/*" -x "build/*" -x "*.zip" -x "src/legends/*"
        shell: bash

      - name: Upload source code 📦
        if: matrix.build_variant == 'gecko'
        uses: actions/upload-artifact@v6
        with:
          name: ambire-extension-v${{ steps.version.outputs.VERSION }}-${{ matrix.artifact_suffix }}-SOURCE-CODE
          path: ./extension-source-code.zip

      - name: Upload extension builds 📦
        uses: actions/upload-artifact@v6
        with:
          name: ambire-extension-v${{ steps.version.outputs.VERSION }}-${{ matrix.artifact_suffix }}-with-sourcemaps
          path: ./build/*.zip

      # Only Ambire Next is submitted automatically, because it is the variant
      # that gets released most often. The production webkit and gecko builds are
      # still submitted by hand, as their reviews need extra care (e.g. the
      # separate source code .zip that Firefox requires).
      - name: Submit Ambire Next to the Chrome Web Store for review 🚀
        if: matrix.build_variant == 'next:webkit' && inputs.submit_next_to_chrome_web_store
        env:
          BROWSER_EXTENSION_PUBLIC_KEY: ${{ vars.BROWSER_EXTENSION_PUBLIC_KEY }}
          CLIENT_ID: ${{ secrets.CHROME_WEB_STORE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_WEB_STORE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_WEB_STORE_REFRESH_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          # The build produces two .zip files, so the extension one must be picked explicitly
          ZIP="./build/ambire-extension-v${VERSION}-next-webkit.zip"
          test -f "$ZIP" || { echo "::error::Extension .zip not found: $ZIP"; exit 1; }

          # The store item ID is derived from the very same public key that
          # webpack writes into manifest.key, so it is never hardcoded here:
          # Chrome takes the first 128 bits of the key's SHA-256 and remaps the
          # hex digits 0-f onto the letters a-p. Because every build variant
          # reads its key from its own GitHub environment, this step stays
          # correct if it is ever enabled for the stable build too.
          test -n "$BROWSER_EXTENSION_PUBLIC_KEY" || { echo "::error::BROWSER_EXTENSION_PUBLIC_KEY is empty, so the Chrome Web Store item ID cannot be derived."; exit 1; }
          ITEM_ID=$(printf '%s' "$BROWSER_EXTENSION_PUBLIC_KEY" | base64 -d | sha256sum | head -c 32 | tr '0-9a-f' 'a-p')
          echo "Derived Chrome Web Store item ID: $ITEM_ID"

          ACCESS_TOKEN=$(curl -s --fail-with-body -X POST https://oauth2.googleapis.com/token \
            -d "client_id=$CLIENT_ID" \
            -d "client_secret=$CLIENT_SECRET" \
            -d "refresh_token=$REFRESH_TOKEN" \
            -d "grant_type=refresh_token" | jq -er '.access_token') \
            || { echo "::error::Could not refresh the Chrome Web Store access token. Note that the refresh token silently expires after 7 days while the Google OAuth consent screen is in Testing mode. Publish the consent screen (or set it to Internal) and generate a new refresh token."; exit 1; }

          echo "Uploading $ZIP as a new version of item $ITEM_ID"
          # This endpoint responds with HTTP 200 even for a rejected upload, so
          # the uploadState in the body is what actually tells us if it worked.
          UPLOAD=$(curl -s --fail-with-body -X PUT -T "$ZIP" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "x-goog-api-version: 2" \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/$ITEM_ID")
          echo "$UPLOAD"
          [ "$(jq -r '.uploadState' <<< "$UPLOAD")" = "SUCCESS" ] \
            || { echo "::error::Upload failed: $(jq -r '[.itemError[]?.error_detail] | join("; ")' <<< "$UPLOAD")"; exit 1; }

          echo "Submitting version $VERSION for review"
          # Once the review passes, the version goes live automatically. To keep
          # control over the go-live moment, switch the item to "Publish manually
          # after review" in the Developer Dashboard - the API has no
          # submit-without-publishing call.
          PUBLISH=$(curl -s --fail-with-body -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "x-goog-api-version: 2" \
            -H "Content-Length: 0" \
            "https://www.googleapis.com/chromewebstore/v1.1/items/$ITEM_ID/publish")
          echo "$PUBLISH"
          jq -e '.status | index("OK")' <<< "$PUBLISH" > /dev/null \
            || { echo "::error::Submitting for review failed: $(jq -r '.statusDetail | join("; ")' <<< "$PUBLISH")"; exit 1; }

          echo "✅ Ambire Next v${VERSION} submitted for review"
        shell: bash
