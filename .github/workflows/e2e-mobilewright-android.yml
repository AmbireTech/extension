name: 🤖 Mobilewright · Android

# Manual trigger. Installs an already-built Android APK — the artifact from a
# "🤖 Build · Android APK" (build-android-apk.yml) run — on an emulator and runs the
# Mobilewright Android suite against it. Build that workflow first, or leave the input
# blank to use its most recent successful run.
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'Run ID of a "🤖 Build · Android APK" run to test (blank = latest successful)'
        required: false
        type: string

permissions:
  contents: read
  actions: read

env:
  IS_TESTING: 'true'
  RELAYER_URL: ${{ vars.RELAYER_URL }}
  VELCRO_URL: ${{ vars.VELCRO_URL }}
  BA_ACCOUNTS: ${{ vars.BA_ACCOUNTS }}
  BA_KEYSTORE_UID: ${{ vars.BA_KEYSTORE_UID }}
  BA_KEYS: ${{ vars.BA_KEYS }}
  BA_SEEDS: ${{ vars.BA_SEEDS }}
  BA_LEARNED_ASSETS: ${{ vars.BA_LEARNED_ASSETS }}
  BA_SELECTED_ACCOUNT: ${{ vars.BA_SELECTED_ACCOUNT }}
  SA_ACCOUNTS: ${{ vars.SA_ACCOUNTS }}
  SA_KEYSTORE_UID: ${{ vars.SA_KEYSTORE_UID }}
  SA_KEYS: ${{ vars.SA_KEYS }}
  SA_SEEDS: ${{ vars.SA_SEEDS }}
  SA_LEARNED_ASSETS: ${{ vars.SA_LEARNED_ASSETS }}
  SA_SELECTED_ACCOUNT: ${{ vars.SA_SELECTED_ACCOUNT }}
  DEFAULT_INVITATION_CODE_DEV: ${{ vars.DEFAULT_INVITATION_CODE_DEV }}

jobs:
  android-tests:
    runs-on: ubuntu-latest
    environment: testing
    env:
      KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
      SEED: ${{ secrets.SEED }}
      SEED_24_WORDS: ${{ secrets.SEED_24_WORDS }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      BA_SECRETS: ${{ secrets.BA_SECRETS }}
      SA_SECRETS: ${{ secrets.SA_SECRETS }}
      SA_ACCOUNT_JSON: ${{ secrets.SA_ACCOUNT_JSON }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install Node.js ⚙️
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
          cache-dependency-path: e2e-playwright-tests/yarn.lock

      # The mobile specs import shared helpers from the parent e2e-playwright-tests
      # package (constants/*, @helpers/*, utils/env/*), so its deps must be installed too.
      - name: Install shared e2e dependencies
        working-directory: ./e2e-playwright-tests
        run: yarn install --frozen-lockfile && yarn postinstall

      - name: Install Mobilewright test dependencies
        working-directory: ./e2e-playwright-tests/e2e-mobile-tests
        run: npm ci

      - name: Download Android build (APK)
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="$BUILD_RUN_ID"
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list --workflow build-android-apk.yml --status success \
              --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "::error::No successful '🤖 Build · Android APK' run found. Run that workflow first."
            exit 1
          fi
          echo "Using Android build from run $RUN_ID"
          mkdir -p android-build
          gh run download "$RUN_ID" --pattern 'ambire-android-v*-apk' --dir android-build

      - name: Unpack Android build
        shell: bash
        run: |
          set -euo pipefail
          ZIP_PATH=$(find ./android-build -type f -name '*.zip' | head -n1)
          if [ -z "$ZIP_PATH" ]; then
            echo "No Android build zip found in ./android-build"
            find ./android-build || true
            exit 1
          fi
          # Inner zip holds Ambire.apk at its root — matches installApps: './Ambire.apk'
          # in mobilewright.config.ts.
          unzip -o "$ZIP_PATH" -d ./e2e-playwright-tests/e2e-mobile-tests

      # Standard workaround so the Android emulator gets hardware acceleration (KVM)
      # on GitHub-hosted Linux runners. See reactivecircus/android-emulator-runner docs.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Mobilewright Android tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # API 34 = Android 14. The app supports API 24..36 — bump this to match your
          # local Android Studio AVD if you want CI to run on the same OS version.
          api-level: 34
          target: google_apis
          arch: x86_64
          # profile` is an avdmanager device id (lowercase). mobilecli reports the AVD
          # name back with underscores turned into spaces, so `avd-name: Pixel_6` shows
          # up as "Pixel 6" and matches the `deviceName: /Pixel/` regex in
          # mobilewright.config.ts's android project.
          profile: pixel_6
          avd-name: Pixel_6
          disable-animations: true
          disable-spellchecker: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: cd e2e-playwright-tests/e2e-mobile-tests && npx mobilewright test --project=android --reporter html

      - name: Upload Android report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mobilewright-report-android
          path: ./e2e-playwright-tests/e2e-mobile-tests/mobilewright-report/
          retention-days: 14
