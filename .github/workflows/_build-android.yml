# Reusable Android build steps (APK or AAB).
# Call from build-android-apk.yml / build-android-aab.yml with appropriate inputs.

name: The reusable (common) Android build steps

on:
  workflow_call:
    inputs:
      build_command:
        description: Yarn command used to build Android artifact
        required: true
        type: string
      artifact_suffix:
        description: Suffix appended to uploaded artifact name
        required: true
        type: string
      package_mode:
        description: Packaging mode (apk or aab)
        required: true
        type: string
      architectures:
        description: Comma-separated list of ABIs to build (reactNativeArchitectures)
        required: false
        default: arm64-v8a
        type: string
      enable_signing:
        description: Whether Play Store signing (release keystore) is required
        required: false
        default: false
        type: boolean

jobs:
  build-android:
    name: Build Android artifact and upload
    environment: extension-production
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}

    steps:
      # Android AAB builds for two architectures (armeabi-v7a + arm64-v8a) combined with
      # node_modules and the Gradle cache exhaust the ~14 GB available on ubuntu-latest runners,
      # causing "No space left on device" during packageReleaseBundle. Freeing pre-installed
      # tools we don't need (~20 GB) resolves this without switching to a larger runner.
      - name: Free disk space 🧹
        uses: jlumbroso/free-disk-space@v1.3.0
        with:
          tool-cache: false # Keep cached tools (Node.js, Java) — needed for the build
          android: false # Keep Android SDK — needed for the build
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout code 🛎️
        uses: actions/checkout@v6

      - name: Add SSH key to checkout a private repo
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Git submodule init
        run: git submodule init
        shell: bash

      - name: Git submodule update
        run: git submodule update
        shell: bash

      - name: Install Node.js ⚙️
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Install JS dependencies
        run: yarn setup:ci
        shell: bash

      - name: Build webview
        run: yarn build:webview
        shell: bash

      - name: Get version from app.json
        id: version
        run: echo "VERSION=$(grep '"version"' ./app.json | head -n1 | cut -d':' -f2 | tr -d ' ",')" >> $GITHUB_OUTPUT
        shell: bash

      - name: Set up JDK (from .java-version)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: gradle

      # Configure Gradle caching and build optimizations for CI.
      # This speeds up builds by caching Gradle dependencies and wrapper files
      # between workflow runs.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # The AAB and the APK are signed with different keys on purpose. The AAB goes to Play,
      # which re-signs it with the app signing key Google holds and never releases, so our
      # keystore there is only an upload identity. A sideloaded APK gets no such re-signing,
      # so it carries its own long-lived key - and because that key differs from Play's, the
      # sideloaded app can never be installed over a Play install (and vice versa).
      - name: Prepare Android signing config
        if: inputs.enable_signing
        env:
          PLAY_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PLAY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PLAY_KEY_ALIAS_PASSWORD: ${{ secrets.ANDROID_KEY_ALIAS_PASSWORD }}
          SIDELOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIDELOAD_KEYSTORE_BASE64 }}
          SIDELOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIDELOAD_KEYSTORE_PASSWORD }}
          SIDELOAD_KEY_ALIAS: ${{ secrets.ANDROID_SIDELOAD_KEY_ALIAS }}
          SIDELOAD_KEY_ALIAS_PASSWORD: ${{ secrets.ANDROID_SIDELOAD_KEY_ALIAS_PASSWORD }}
        run: |
          set -euo pipefail

          # The keystore is picked in bash rather than in a GitHub expression because an unset
          # secret is an empty string: a `package_mode == 'apk' && A || B` expression would
          # resolve to B when A is missing, silently signing the sideload APK with the Play
          # upload key - the exact mix-up this split exists to prevent.
          if [ "${{ inputs.package_mode }}" = "apk" ]; then
            KEYSTORE_BASE64="${SIDELOAD_KEYSTORE_BASE64:-}"
            KEYSTORE_PASSWORD="${SIDELOAD_KEYSTORE_PASSWORD:-}"
            KEY_ALIAS="${SIDELOAD_KEY_ALIAS:-}"
            KEY_ALIAS_PASSWORD="${SIDELOAD_KEY_ALIAS_PASSWORD:-}"
            REQUIRED_SECRETS="ANDROID_SIDELOAD_KEYSTORE_BASE64, ANDROID_SIDELOAD_KEYSTORE_PASSWORD, ANDROID_SIDELOAD_KEY_ALIAS, ANDROID_SIDELOAD_KEY_ALIAS_PASSWORD"
          else
            KEYSTORE_BASE64="${PLAY_KEYSTORE_BASE64:-}"
            KEYSTORE_PASSWORD="${PLAY_KEYSTORE_PASSWORD:-}"
            KEY_ALIAS="${PLAY_KEY_ALIAS:-}"
            KEY_ALIAS_PASSWORD="${PLAY_KEY_ALIAS_PASSWORD:-}"
            REQUIRED_SECRETS="ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_ALIAS_PASSWORD"
          fi

          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_ALIAS_PASSWORD" ]]; then
            echo "::error::Android signing secrets are missing for package_mode=${{ inputs.package_mode }}. Required: $REQUIRED_SECRETS"
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/android-release.keystore"
          (echo -n "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH") || \
          (echo -n "$KEYSTORE_BASE64" | base64 -D > "$KEYSTORE_PATH")

          mkdir -p "$HOME/.gradle"
          {
            echo "MYAPP_UPLOAD_STORE_FILE=$KEYSTORE_PATH"
            echo "MYAPP_UPLOAD_STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "MYAPP_UPLOAD_KEY_ALIAS=$KEY_ALIAS"
            echo "MYAPP_UPLOAD_KEY_PASSWORD=$KEY_ALIAS_PASSWORD"
          } >> "$HOME/.gradle/gradle.properties"

      - name: Build Android app
        env:
          # Force production React/Metro bundle in CI (avoids dev/prod mismatch with NODE_ENV undefined)
          NODE_ENV: production
          # Stallion native config — the build command inlines build:inject:mobile-ota-config,
          # which seds these into Info.plist/strings.xml so the app knows its Stallion project.
          STALLION_PROJECT_ID: ${{ vars.STALLION_PROJECT_ID }}
          STALLION_APP_TOKEN: ${{ secrets.STALLION_APP_TOKEN }}
          STALLION_PUBLIC_SIGNING_KEY: ${{ vars.STALLION_PUBLIC_SIGNING_KEY }}
          RELAYER_URL: ${{ vars.RELAYER_URL }}
          VELCRO_URL: ${{ vars.VELCRO_URL }}
          REACT_APP_PIMLICO_API_KEY: ${{ vars.REACT_APP_PIMLICO_API_KEY }}
          REACT_APP_ETHERSPOT_API_KEY: ${{ vars.REACT_APP_ETHERSPOT_API_KEY }}
          REACT_APP_CANDIDE_API_KEY: ${{ vars.REACT_APP_CANDIDE_API_KEY }}
          REACT_APP_GELATO_API_KEY: ${{ vars.REACT_APP_GELATO_API_KEY }}
          NFT_CDN_URL: ${{ vars.NFT_CDN_URL }}
          LEGENDS_NFT_ADDRESS: ${{ vars.LEGENDS_NFT_ADDRESS }}
          LI_FI_API_KEY: ${{ vars.LI_FI_API_KEY }}
          COWSWAP_API_KEY: ${{ vars.COWSWAP_API_KEY }}
          BUNGEE_API_KEY: ${{ vars.BUNGEE_API_KEY }}
          UNISWAP_API_KEY: ${{ vars.UNISWAP_API_KEY }}
          SAFE_API_KEY: ${{ vars.SAFE_API_KEY }}
          WALLETCONNECT_PROJECT_ID: ${{ vars.WALLETCONNECT_PROJECT_ID }}
          ORG_GRADLE_PROJECT_reactNativeArchitectures: ${{ inputs.architectures }}
          # CI-only Gradle/JVM tuning:
          # - Disable Gradle daemon and parallelism to avoid long-lived processes and high memory usage.
          # - Increase Metaspace limit to reduce risk of OutOfMemoryError: Metaspace during large native builds.
          # These settings apply only in GitHub Actions and do NOT affect local builds.
          JAVA_TOOL_OPTIONS: '-XX:MaxMetaspaceSize=1024m'
          GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.parallel=false'
        run: ${{ inputs.build_command }}
        shell: bash

      # Published as a bare .apk rather than a .zip: it is what users tap to install, and what
      # updaters that watch the releases page (Obtainium) expect to find. Its integrity proof is
      # the signature below, not a checksum - Android refuses any APK whose signer changed.
      - name: Package Android APK
        if: inputs.package_mode == 'apk'
        run: |
          set -euo pipefail
          APK_DIR="android/app/build/outputs/apk/release"

          if [ ! -d "$APK_DIR" ]; then
            echo "Expected APK output dir not found at $APK_DIR"
            ls -R android/app/build/outputs || true
            exit 1
          fi

          APK_PATH=$(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' | head -n1)
          if [ -z "$APK_PATH" ]; then
            echo "No .apk found in $APK_DIR"
            ls -la "$APK_DIR" || true
            exit 1
          fi

          OUTPUT_APK="$(pwd)/Ambire-v${{ steps.version.outputs.VERSION }}.apk"
          cp "$APK_PATH" "$OUTPUT_APK"
          echo "PACKAGE_PATH=$OUTPUT_APK" >> $GITHUB_ENV
        shell: bash

      # Guards against the APK going out signed by anything other than the sideload key -
      # a stale gradle.properties, a swapped secret, or the debug keystore fallback. The
      # expected value is a repository variable so that changing it is a reviewable commit
      # in the repo settings, not something a workflow edit can quietly redefine.
      - name: Verify APK signature
        if: inputs.package_mode == 'apk'
        env:
          EXPECTED_CERT_SHA256: ${{ vars.ANDROID_SIDELOAD_CERT_SHA256 }}
        run: |
          set -euo pipefail

          if [ -z "${EXPECTED_CERT_SHA256:-}" ]; then
            echo "::error::Repository variable ANDROID_SIDELOAD_CERT_SHA256 is not set, so the signer cannot be verified"
            exit 1
          fi

          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER=$(find "$SDK_DIR/build-tools" -maxdepth 2 -name apksigner 2>/dev/null | sort -V | tail -n1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found under $SDK_DIR/build-tools"
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "$PACKAGE_PATH" | tee apksigner-output.txt

          # apksigner prints lowercase hex without separators; keytool and the Play Console
          # print uppercase colon-separated, so both sides are normalised before comparing.
          ACTUAL=$(grep -m1 'certificate SHA-256 digest' apksigner-output.txt | awk '{print $NF}' | tr 'A-Z' 'a-z')
          EXPECTED=$(echo "$EXPECTED_CERT_SHA256" | tr -d ': ' | tr 'A-Z' 'a-z')

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::APK is signed by the wrong key. Expected $EXPECTED, got $ACTUAL"
            exit 1
          fi

          # Signature Scheme v2 is mandatory for targetSdk 30+ and is what protects the whole
          # file rather than just its entries, so a v1-only APK must not ship.
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' apksigner-output.txt || {
            echo "::error::APK is not signed with APK Signature Scheme v2"
            exit 1
          }
        shell: bash

      - name: Package Android AAB
        if: inputs.package_mode == 'aab'
        run: |
          set -euo pipefail
          BUNDLE_DIR="android/app/build/outputs/bundle/release"
          OUTPUT_ZIP="ambire-android-v${{ steps.version.outputs.VERSION }}-aab.zip"

          if [ ! -d "$BUNDLE_DIR" ]; then
            echo "Expected bundle output dir not found at $BUNDLE_DIR"
            ls -R android/app/build/outputs || true
            exit 1
          fi

          AAB_PATH=$(find "$BUNDLE_DIR" -maxdepth 1 -type f -name '*.aab' | head -n1)
          if [ -z "$AAB_PATH" ]; then
            echo "No .aab found in $BUNDLE_DIR"
            ls -la "$BUNDLE_DIR" || true
            exit 1
          fi

          ZIP_PATH="$(pwd)/$OUTPUT_ZIP"
          TEMP_DIR="$RUNNER_TEMP/android-aab-package"
          rm -rf "$TEMP_DIR"
          mkdir -p "$TEMP_DIR"
          cp "$AAB_PATH" "$TEMP_DIR/Ambire.aab"
          cd "$TEMP_DIR"
          zip -r "$ZIP_PATH" "Ambire.aab"
          echo "PACKAGE_PATH=$ZIP_PATH" >> $GITHUB_ENV
        shell: bash

      - name: Upload Android build 📦
        uses: actions/upload-artifact@v6
        with:
          name: ambire-android-v${{ steps.version.outputs.VERSION }}-${{ inputs.artifact_suffix }}
          path: ${{ env.PACKAGE_PATH }}

      # Only when run from a tag, which is how a release build is started - a run from a branch
      # is a test build and has no release to attach to. Only the APK: the .aab is submitted to
      # Play by hand and must never be a public download, since Play re-signs it and as
      # downloaded here it cannot be installed on a device at all.
      #
      # Failing here loses nothing - the APK is already up as a workflow artifact by this point.
      - name: Attach the APK to the release
        if: inputs.package_mode == 'apk' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::No release exists for tag $TAG. Cut the release first, then re-run this workflow - the APK is available as a workflow artifact in the meantime."
            exit 1
          fi
          gh release upload "$TAG" "$PACKAGE_PATH" --repo "$GITHUB_REPOSITORY" --clobber
        shell: bash
